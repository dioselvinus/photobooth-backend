<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Not Found — PicCorner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, system-ui, sans-serif;
        }
    </style>
</head>
<body class="bg-[#fafafa] text-[#18181b] min-h-screen flex flex-col justify-between antialiased selection:bg-[#ff385c] selection:text-white">

    <!-- Header -->
    <header class="w-full max-w-6xl mx-auto px-6 py-8 flex items-center justify-between">
        <a href="/" class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-[#ff385c] to-[#ff6b8b] flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-[#ff385c]/25">
                📸
            </div>
            <span class="text-xl font-bold tracking-tight text-[#18181b]">PicCorner</span>
        </a>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col items-center justify-center text-center px-6 py-12">
        <div class="max-w-md mx-auto">
            <div class="text-6xl font-black text-[#ff385c] mb-2 tracking-tight">404</div>
            <h1 class="text-2xl font-bold text-zinc-900 mb-3">Gallery Not Found</h1>
            <p class="text-sm text-zinc-600 mb-6 leading-relaxed">
                This gallery link may be incorrect, or the 30-day session retention period has passed. Please check your email or scan your photo strip's QR code.
            </p>

            <a href="/" class="inline-flex items-center gap-2 text-xs font-semibold text-zinc-500 hover:text-zinc-900 transition">
                ← Back to Home
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-6xl mx-auto px-6 py-8 border-t border-zinc-200/60 text-center text-xs text-zinc-500">
        <p>Powered by <strong class="text-zinc-700">PicCorner</strong> • Keep on smiling!</p>
    </footer>
</body>
</html>
