<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Photobooth Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Using Inter as the closest open-source substitute for Airbnb Cereal VF/Circular */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', -apple-system, system-ui, Roboto, "Helvetica Neue", sans-serif;
        }
    </style>
</head>
<body class="bg-[#ffffff] text-[#222222] min-h-screen flex flex-col justify-between antialiased" data-code="{{.SessionCode}}">

    <!-- Max width capped at ~1280px with 64px (py-16) section padding -->
    <div class="max-w-[1280px] mx-auto px-6 py-16 w-full">
        <header class="text-center mb-16">
            <!-- Display XL: 28px, Weight 700 -->
            <h1 class="text-[28px] font-bold tracking-tight mb-2 text-[#222222]">Corner Gallery</h1>
            <!-- Muted metadata & 30-day notice -->
            <div class="flex flex-col gap-1 items-center">
                <p class="text-[14px] text-[#6a6a6a]">Session Code: <span class="font-mono text-[#222222] font-medium">{{.SessionCode}}</span></p>
                <p class="text-[14px] text-[#6a6a6a] bg-[#f7f7f7] px-3 py-1 rounded-full mt-2 inline-block">
                    Photos available for {{.DaysLeft}} more {{if eq .DaysLeft 1}}day{{else}}days{{end}}
                </p>
            </div>
        </header>

        <!-- Dense marketplace grid: 16px to 24px gutters, dropping columns elegantly on smaller breakpoints -->
        <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 items-start"></div>
    </div>

    <!-- Editorial Footer: Hairline border, muted soft text -->
    <footer class="text-center py-12 border-t border-[#dddddd] text-[13px] text-[#6a6a6a] bg-[#ffffff]">
   	<p style="font-size: 12px; color: #a1a1aa; margin: 0;">Powered by <strong style="color: #71717a;">PicCorner</strong> • Keep on smiling!</p>
    </footer>

    <script>
        const code = document.body.dataset.code;
        const grid = document.getElementById('grid');

        function labelFor(src) {
            const name = decodeURIComponent(src.split('?')[0]);
            if (name.indexOf('strip') !== -1) return 'Photo Strip';
            if (name.indexOf('gif') !== -1 || name.indexOf('animation') !== -1) return 'Animation';
            return 'Capture';
        }

        function tile(src) {
            const div = document.createElement('div');
            div.className = 'flex flex-col gap-3 group';
            // Square fallback until the image loads; real ratio set onload.
            div.innerHTML =
                '<div class="relative overflow-hidden bg-[#f7f7f7] rounded-[14px] hover:shadow-[rgba(0,0,0,0.02)_0_0_0_1px,rgba(0,0,0,0.04)_0_2px_6px_0,rgba(0,0,0,0.1)_0_4px_8px_0] transition-shadow duration-300" style="aspect-ratio:1/1">' +
                '<img src="' + src + '" alt="Photobooth Asset" class="object-contain w-full h-full" ' +
                'onload="this.parentElement.style.aspectRatio = this.naturalWidth + \'/\' + this.naturalHeight">' +
                '</div>' +
                '<div class="flex items-center justify-between px-1">' +
                '<span class="text-[14px] text-[#222222] font-medium">' + labelFor(src) + '</span>' +
                '<a href="' + src + '" download class="bg-[#ff385c] hover:bg-[#e00b41] text-[#ffffff] text-[14px] font-medium px-4 py-2 rounded-[8px] transition-colors">Download</a>' +
                '</div>';
            return div;
        }

        function placeholder() {
            const div = document.createElement('div');
            div.className = 'flex flex-col gap-3 group';
            div.innerHTML =
                '<div class="relative overflow-hidden aspect-square bg-[#f7f7f7] rounded-[14px] animate-pulse flex items-center justify-center">' +
                '<span class="text-[13px] text-[#a1a1aa]">Uploading…</span>' +
                '</div>';
            return div;
        }

        // Renders uploaded images plus placeholder tiles for the not-yet-uploaded
        // remainder (file_count is the expected total).
        function render(urls, fileCount) {
            grid.innerHTML = '';
            urls.forEach(function (u) { grid.appendChild(tile(u)); });
            var missing = Math.max(0, fileCount - urls.length);
            for (var i = 0; i < missing; i++) grid.appendChild(placeholder());
            return fileCount > 0 && urls.length >= fileCount;
        }

        var done = false;
        async function poll() {
            try {
                var res = await fetch('/api/sessions/' + code);
                if (!res.ok) { if (res.status === 404) window.location.reload(); return; }
                var data = await res.json();
                if (render(data.image_urls, data.file_count)) done = true;
            } catch (e) { /* transient network issue; retry next tick */ }
        }
        poll();
        setInterval(function () { if (!done) poll(); }, 3000);
    </script>
</body>
</html>
