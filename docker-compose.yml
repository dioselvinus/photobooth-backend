services:
  app:
    build: .
    image: photobooth-backend:latest
    container_name: photobooth_app
    restart: unless-stopped
    env_file: .env
    mem_limit: 256m
    pids_limit: 100
    expose:
      - "8080" # Exposed internally to the Compose network, not publicly
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: photobooth_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
